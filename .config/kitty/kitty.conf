# ============================================================
#  Fonts
# ============================================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Enable JetBrains Mono ligatures everywhere (set to `never` to disable)
disable_ligatures never

# ============================================================
#  Cursor
# ============================================================
cursor                  #F5C2E7
cursor_text_color       #1E1E2E
cursor_shape            beam
cursor_beam_thickness   1.6
cursor_blink_interval   0.5
# Smooth cursor trail (kitty >= 0.36)
cursor_trail            3
cursor_trail_decay      0.1 0.4
cursor_trail_start_threshold 2

# ============================================================
#  Scrollback & Mouse
# ============================================================
scrollback_lines        10000
mouse_hide_wait         3.0
url_color               #F5C2E7
url_style               curly
detect_urls             yes
copy_on_select          yes
strip_trailing_spaces   smart

# ============================================================
#  Window layout
# ============================================================
background_opacity          0.92
dynamic_background_opacity  yes
window_padding_width        12
confirm_os_window_close     0
hide_window_decorations     yes

# Inactive windows dim a touch so the focused one pops
inactive_text_alpha     0.85

# Window borders (Catppuccin Mocha)
active_border_color     #F5C2E7
inactive_border_color   #45475A
window_border_width     1pt
draw_minimal_borders    yes

# ============================================================
#  Tab bar
# ============================================================
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_title_template      "{index}: {title}"
active_tab_foreground   #1E1E2E
active_tab_background   #F5C2E7
active_tab_font_style   bold
inactive_tab_foreground #BAC2DE
inactive_tab_background #313244
inactive_tab_font_style normal

# ============================================================
#  Bell
# ============================================================
enable_audio_bell       no
visual_bell_duration    0.0
window_alert_on_bell    yes

# ============================================================
#  Colors — Catppuccin Mocha
# ============================================================
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5C2E7

color0  #45475A
color1  #F38BA8
color2  #A6E3A1
color3  #F9E2AF
color4  #89B4FA
color5  #F5C2E7
color6  #94E2D5
color7  #BAC2DE
color8  #585B70
color9  #F38BA8
color10 #A6E3A1
color11 #F9E2AF
color12 #89B4FA
color13 #F5C2E7
color14 #94E2D5
color15 #A6ADC8

# ============================================================
#  Behaviour
# ============================================================
startup_session         none
shell_integration       enabled
allow_remote_control    yes
