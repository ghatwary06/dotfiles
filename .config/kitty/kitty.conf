# ============================================================
#  Fonts
# ============================================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Enable JetBrains Mono ligatures everywhere (set to `never` to disable)
disable_ligatures never

# ============================================================
#  Cursor
# ============================================================
cursor                  #B48EAD
cursor_text_color       #2E3440
cursor_shape            beam
cursor_beam_thickness   1.6
cursor_blink_interval   0.5
# Smooth cursor trail (kitty >= 0.36)
cursor_trail            3
cursor_trail_decay      0.1 0.4
cursor_trail_start_threshold 2

# ============================================================
#  Scrollback & Mouse
# ============================================================
scrollback_lines        10000
mouse_hide_wait         3.0
url_color               #B48EAD
url_style               curly
detect_urls             yes
copy_on_select          yes
strip_trailing_spaces   smart

# ============================================================
#  Window layout
# ============================================================
background_opacity          0.92
dynamic_background_opacity  yes
# 8 instead of 12: buys ~1 column each side, which matters when fastfetch is
# deciding between its wide and compact layout in a narrow niri column.
window_padding_width        8
confirm_os_window_close     0
hide_window_decorations     yes

# Inactive windows dim a touch so the focused one pops
inactive_text_alpha     0.85

# Window borders (Nord)
active_border_color     #B48EAD
inactive_border_color   #434C5E
window_border_width     1pt
draw_minimal_borders    yes

# ============================================================
#  Tab bar
# ============================================================
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_title_template      "{index}: {title}"
active_tab_foreground   #2E3440
active_tab_background   #B48EAD
active_tab_font_style   bold
inactive_tab_foreground #D8DEE9
inactive_tab_background #3B4252
inactive_tab_font_style normal

# ============================================================
#  Bell
# ============================================================
enable_audio_bell       no
visual_bell_duration    0.0
window_alert_on_bell    yes

# ============================================================
#  Colors — Nord
# ============================================================
foreground              #ECEFF4
background              #2E3440
selection_foreground    #2E3440
selection_background    #B48EAD

color0  #434C5E
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #81A1C1
color5  #B48EAD
color6  #8FBCBB
color7  #D8DEE9
color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #C0C8D4

# ============================================================
#  Behaviour
# ============================================================
startup_session         none
shell_integration       enabled
allow_remote_control    yes
