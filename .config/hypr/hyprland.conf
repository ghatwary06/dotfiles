# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################



# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# External (ViewSonic) is the PRIMARY display at 0x0 (left).
# Laptop panel sits to the RIGHT at 1920x0, so cursor-right crosses into it.
monitor=HDMI-A-1,1920x1080@144.00,0x0,1
monitor=eDP-1,1920x1200@144,1920x0,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun        # was: hyprlauncher (not installed/unconfigured). rofi config IS in these dotfiles.


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
#  & hyprpaper & firefox


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Render on the NVIDIA GPU. HDMI-A-1 is wired to the dGPU; rendering there
# avoids a per-frame cross-GPU copy, which is what caused the external-monitor
# stutter. Trade-off: dGPU stays awake, so worse battery on the road.
#
# !! THIS NUMBER GOES STALE. /dev/dri/cardN is assigned by driver probe order.
# The 2026-08-02 kernel upgrade (linux-cachyos 7.1.4 -> 7.1.5) moved the dGPU
# from card2 to card0, and the then-current "card2:card1" silently resolved to
# Intel-only -- no error at all, HDMI-A-1 simply never appeared and kept showing
# the greeter's last frame ("stuck on the login screen").
#
# This file is only the ROLLBACK config (Hyprland ignores it while
# hyprland.lua exists), so it cannot resolve the number at runtime the way
# hyprland.lua does. If you ever fall back to this file, CHECK THE NUMBER FIRST:
#   readlink -f /dev/dri/by-path/pci-0000:01:00.0-card   # NVIDIA dGPU
#   readlink -f /dev/dri/by-path/pci-0000:00:02.0-card   # Intel iGPU
# Correct as of 2026-08-06: NVIDIA=card0, Intel=card1.
#
# Use the real card nodes, NOT the /dev/dri/by-path symlinks -- passing
# aquamarine the symlinks is the prime suspect for the 2026-08-06 hang that
# black-screened both monitors and wedged VT switching.
env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(88C0D0ff) rgba(81A1C1ff) 45deg
    col.inactive_border = rgba(3B4252ff)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 12

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # NOTE: this file originally had TWO blur blocks (size 6/passes 3, then size 3/passes 1).
    # Hyprland applied the last one, so size 6/passes 3 was already dead. Kept the effective
    # values below (behavior unchanged). Bump size/passes if you want heavier blur.
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces, 1, 5, easeOutQuint, slide
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # no anime mascot wallpapers
    disable_hyprland_logo = true # no hyprland logo background -- we set our own wallpaper
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    # Two layouts, Windows-style Alt+Shift to cycle. Order matters: the FIRST
    # entry is what every keyboard starts on at login, so "us" stays first.
    # The toggle is XKB's own (grp:alt_shift_toggle), not a Hyprland bind, so it
    # cannot collide with the keybinds below and works in XWayland clients too.
    kb_layout = us,ara
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
# bind = $mainMod, R, exec, $menu   # REPLACED by Caelestia launcher (see caelestia.conf)
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
# Moved off SUPER+SHIFT+S (that collided with the screenshot bind and made the
# window stick to the scratchpad, floating on top across all workspaces).
bind = $mainMod ALT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys -> SwayOSD (small GNOME/Windows-style on-screen popup).
# Falls back to wpctl/brightnessctl if swayosd isn't installed yet, so keys always work.
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise 2>/dev/null || wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower 2>/dev/null || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle 2>/dev/null || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle 2>/dev/null || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise 2>/dev/null || brightnessctl -d nvidia_wmi_ec_backlight set +5%
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower 2>/dev/null || brightnessctl -d nvidia_wmi_ec_backlight set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# External (HDMI-A-1) is primary -> gets workspaces 1-5, default focus on 1.
# Laptop (eDP-1) gets 6-10.
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:eDP-1, default:true
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1
# Ignore maximize requests from all apps. You'll probably like this.
windowrule {
    name = suppress-maximize-all
    suppress_event = maximize
    match:class = .*
}

# Fix some dragging issues with XWayland
windowrule {
    name = nofocus-empty-xwayland
    no_focus = 1
    match:class = ^$
    match:title = ^$
    match:xwayland = 1
    match:float = 1
    match:fullscreen = 0
    match:pin = 0
}

# Hyprland-run windowrule
windowrule {
    name = hyprland-run-float
    float = 1
    match:class = hyprland-run
}

windowrule {
    name = hyprland-run-move
    move = 20 100%-120
    match:class = hyprland-run
}

# Rounded corners + gaps
exec-once = waybar &> /dev/null &
exec-once = nm-applet
# Wallpaper daemon. The installed package is `awww` (a swww fork in the terra
# repo; it obsoletes swww). Binaries: awww-daemon + `awww img <path>`.
exec-once = awww-daemon &> /dev/null & disown
# Load the last-chosen wallpaper. The path lives in ~/.config/hypr/current-wallpaper,
# which the Super+W picker (rofi) updates. Edit that file to change the default.
exec-once = sleep 1 && awww img "$(cat ~/.config/hypr/current-wallpaper)" &> /dev/null & disown
# Small on-screen volume/brightness popup daemon (GNOME/Windows-style).
exec-once = swayosd-server
# LIBREWOLF PRELOAD — REMOVED 2026-08-06 (was an exec-once launching LibreWolf
# onto a hidden "preload" special workspace to warm it up: 0.62s vs 1.36s, at a
# cost of ~750MB RAM held permanently).
#
# It was removed because the window was NOT hidden -- it overlaid every
# workspace and could only be dismissed with SUPER+Q. A revealed special
# workspace follows you onto whatever workspace you switch to.
#
# NOTE: this legacy `[workspace special:preload silent]` EXEC-PREFIX form is the
# one that actually worked. The bug was introduced by the Lua migration, where
# the prefix became a rules table and `silent` stopped having any effect. If you
# ever roll back to this file the preload would work again -- but it was dropped
# deliberately, so it is left commented out rather than restored.
# exec-once = sh -c 'sleep 8; hyprctl dispatch exec "[workspace special:preload silent] librewolf"'

# Keybinds
bind = SUPER, B, exec, librewolf
bind = SUPER, Space, exec, rofi -show drun
bind = SUPER, R, exec, rofi -show drun
bind = SUPER, F, fullscreen
bind = SUPER, W, exec, ~/.config/rofi/wallpaper-menu.sh
# Region screenshot -> copied to clipboard AND saved to ~/Pictures/Screenshots, with a notification.
# Pressing Esc during selection cancels cleanly (won't clobber the clipboard).
bind = SUPER SHIFT, S, exec, G="$(slurp)" && grim -g "$G" - | tee "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png" | wl-copy && notify-send -a Screenshot "Screenshot copied to clipboard & saved"
# Print = full-screen screenshot, copied + saved.
bind = , Print, exec, grim - | tee "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png" | wl-copy && notify-send -a Screenshot "Full screenshot copied to clipboard & saved"
env = GTK_THEME,Adwaita:dark
env = XCURSOR_THEME,macOS
env = QT_STYLE_OVERRIDE,kvantum
# DISABLED 2026-08-03: the Quickshell side panel (~/.config/quickshell/panel,
# started from rice.conf) is now the notification daemon, and only one process
# can own org.freedesktop.Notifications. To go back to dunst: uncomment this
# line and remove `exec-once = qs -c panel` from rice.conf.
# exec-once = dunst
exec-once = hypridle
bind = SUPER, L, exec, hyprlock
exec-once = blueman-applet
bind = SUPER, C, exec, code
# Super+M restored to exit/shutdown (defined earlier in this file); was conflicting with spotify here.
bind = SUPER, D, exec, spotify-launcher

#############################
### CAELESTIA SHELL (UI)  ###
#############################
# Reverted to the traditional waybar + rofi + dunst setup.
# Caelestia is left installed but NOT sourced. To go back to it, restore the
# line below and comment out the waybar/dunst exec-once + rofi binds above.
# source = ~/.config/hypr/caelestia.conf

#############################
### RICE OVERRIDES (LAST) ###
#############################
# Must stay the last line: theming, layer blur rules, cursor and the side
# panel's autostart live there and deliberately override the defaults set
# above. Existing keybinds and exec-once lines are not touched by it.
source = ~/.config/hypr/rice.conf
