# ====================================================================
# Caelestia shell integration  (sourced at the end of hyprland.conf)
# Provides: bar + launcher + control-center (quick toggles) + notifications
#
# Drawers are toggled over IPC via the caelestia CLI:
#     caelestia shell drawers toggle <name>
# Valid <name>: launcher, dashboard, session, sidebar, utilities
# (To revert everything, just remove the `source = .../caelestia.conf`
#  line in hyprland.conf and re-enable waybar/dunst/rofi there.)
# ====================================================================

# Start the Caelestia Quickshell UI as a daemon on login
exec-once = caelestia shell -d

# --- Launcher (replaces rofi: Super+Space and Super+R) ---
bind = SUPER, Space, exec, caelestia shell drawers toggle launcher
bind = SUPER, R,     exec, caelestia shell drawers toggle launcher

# --- Control center: wifi / bluetooth / mic / volume quick-toggles ---
bind = SUPER, A,     exec, caelestia shell drawers toggle utilities

# --- Dashboard: media / performance / weather ---
bind = SUPER, TAB,   exec, caelestia shell drawers toggle dashboard

# --- Notification + sidebar panel ---
bind = SUPER, N,     exec, caelestia shell drawers toggle sidebar

# --- Session / power menu ---
bind = SUPER SHIFT, X, exec, caelestia shell drawers toggle session
